    <div class="harga" id="hargaInfo">-</div>
    
    <p style="color:#5B6675;">Setelah membayar, kirim bukti transfer ke WhatsApp Admin. Status akan otomatis ter-update.</p>
    
    <div class="status waiting" id="statusText">Menunggu pembayaran...</div>
    
    <button id="btnKirimWA" onclick="kirimKeWhatsApp()">Kirim Bukti ke WhatsApp Admin</button>
</div>

<!-- LIBRARY FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<script>
    // ===== KONFIGURASI FIREBASE (PASTIKAN databaseURL ADA) =====
    const firebaseConfig = {
        apiKey: "AIzaSyAD3HHCS6nEf-K2RV2F-niPNmyoxlV49PE",
        authDomain: "simpeldb.firebaseapp.com",
        databaseURL: "https://simpeldb-default-rtdb.asia-southeast1.firebasedatabase.app", // <-- WAJIB ADA!
        projectId: "simpeldb",
        storageBucket: "simpeldb.firebasestorage.app",
        messagingSenderId: "740760479162",
        appId: "1:740760479162:web:a073dcbac184462b80e983"
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // ===== DATA USER =====
    const userId = sessionStorage.getItem('userId') || 'DEMO-USER-001';
    const paket = sessionStorage.getItem('paket') || 'premium';
    
    // ===== HARGA PAKET =====
    const paketHarga = {
        basic: 60000,
        premium: 299000,
        pro_max: 499000
    };

    // ===== TAMPILKAN INFO PAKET =====
    function renderPaket() {
        const namaPaket = paket.charAt(0).toUpperCase() + paket.slice(1);
        document.getElementById('paketInfo').textContent = 'Paket: ' + namaPaket;
        document.getElementById('hargaInfo').textContent = 'Rp ' + paketHarga[paket].toLocaleString('id-ID');
    }

    // ===== TULIS KE FIREBASE (HANYA JIKA KONEKSI BERHASIL) =====
    async function tulisKeFirebase() {
        const orderId = 'SIM-' + Date.now();
        
        try {
            await db.ref('transactions/' + orderId).set({
                order_id: orderId,
                paket: paket,
                amount: paketHarga[paket],
                status: 'WAITING',
                user_id: userId,
                created_at: Date.now()
            });
            
            sessionStorage.setItem('orderId', orderId);
            
            document.getElementById('statusText').textContent = 'Menunggu verifikasi admin...';
            document.getElementById('statusText').classList.add('waiting');
        } catch (err) {
            alert('Gagal menulis ke Firebase: ' + err.message);
        }
    }

    // ===== KIRIM KE WHATSAPP =====
    function kirimKeWhatsApp() {
        const orderId = sessionStorage.getItem('orderId');
        const nomorAdmin = '6282145111853';
        
        const pesan = `Halo Admin SIMPeL!\n\nSaya sudah membayar paket ${paket}.\nOrder ID: ${orderId}\n\nBerikut bukti transfer saya (dilampirkan).\nMohon diaktifkan. Terima kasih!`;
        
        window.open(`https://wa.me/${nomorAdmin}?text=${encodeURIComponent(pesan)}`, '_blank');
    }

    // ===== CEK STATUS =====
    function cekStatus() {
        const orderId = sessionStorage.getItem('orderId');
        if (!orderId) return;
        
        const statusRef = db.ref('transactions/' + orderId + '/status');
        statusRef.on('value', (snap) => {
            const val = snap.val();
            if (val === 'PAID') {
                document.getElementById('statusText').textContent = '✅ Pembayaran Diterima! User ID: ' + userId;
                document.getElementById('statusText').classList.remove('waiting');
                document.getElementById('statusText').classList.add('paid');
            }
        });
    }

    // ===== INIT =====
    renderPaket();
    tulisKeFirebase();
    cekStatus();
</script>
