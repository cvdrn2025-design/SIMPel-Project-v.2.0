<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pilih Paket SIMPeL</title>
    <style>
        body { font-family: sans-serif; background: #E9EBE6; padding: 20px; }
        .container { max-width: 600px; margin: auto; }
        .card { background: #fff; padding: 20px; border-radius: 8px; margin-bottom: 15px; }
        h1 { color: #10263E; text-align: center; }
        
        .paket { border: 2px solid #E9EBE6; border-radius: 8px; padding: 15px; margin-bottom: 15px; cursor: pointer; transition: all 0.3s; }
        .paket:hover { border-color: #E8801C; }
        .paket.selected { border-color: #E8801C; background: #FFF3DA; }
        
        .paket h3 { margin: 0 0 5px 0; color: #10263E; }
        .paket .harga { font-size: 18px; font-weight: bold; color: #E8801C; }
        .paket .fitur { font-size: 13px; color: #5B6675; margin-top: 8px; }
        
        button { width: 100%; padding: 14px; background: #E8801C; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
        button:hover { background: #C56A12; }
    </style>
</head>
<body>
<div class="container">
    <h1>Pilih Paket Anda</h1>
    
    <div class="card">
        <!-- Paket Basic -->
        <div class="paket" onclick="pilihPaket('basic')">
            <h3>Paket Basic</h3>
            <div class="harga">Rp 60.000 / bulan</div>
            <div class="fitur">✔️ 1 Proyek</div>
            <div class="fitur">⚠️ View-Only</div>
        </div>
        
        <!-- Paket Premium -->
        <div class="paket" onclick="pilihPaket('premium')">
            <h3>Paket Premium</h3>
            <div class="harga">Rp 299.000 / bulan</div>
            <div class="fitur">✔️ 2 Proyek + Add-on</div>
            <div class="fitur">✔️ Full Access</div>
        </div>
        
        <!-- Paket Pro Max -->
        <div class="paket" onclick="pilihPaket('pro_max')">
            <h3>Paket Pro Max</h3>
            <div class="harga">Rp 499.000 / bulan</div>
            <div class="fitur">✔️ 5 Proyek + Add-on</div>
            <div class="fitur">✔️ Full Access</div>
            <div class="fitur">✔️ Modul SiCerMat</div>
        </div>
        
        <button id="btnLanjut" onclick="lanjutKePembayaran()" style="display:none; margin-top:15px;">Lanjut ke Pembayaran</button>
    </div>
</div>

<script>
    let paketTerpilih = null;
    
    function pilihPaket(paket) {
        paketTerpilih = paket;
        
        // Highlight kartu yang dipilih
        document.querySelectorAll('.paket').forEach(el => el.classList.remove('selected'));
        event.currentTarget.classList.add('selected');
        
        // Tampilkan tombol lanjut
        document.getElementById('btnLanjut').style.display = 'block';
    }
    
    function lanjutKePembayaran() {
        if (!paketTerpilih) return;
        
        // Simpan pilihan ke sessionStorage
        sessionStorage.setItem('paket', paketTerpilih);
        
        // Arahkan ke halaman pembayaran
        window.location.href = 'pembayaran.html';
    }
</script>
</body>
</html>
