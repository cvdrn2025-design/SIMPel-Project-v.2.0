<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin SIMPeL</title>
    <style>
        body { font-family: sans-serif; background: #E9EBE6; padding: 20px; }
        .container { max-width: 800px; margin: auto; }
        .card { background: #fff; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        button { padding: 10px; background: #E8801C; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .hide { display: none !important; }
        .tag { display: inline-block; padding: 4px 10px; border-radius: 10px; font-size: 12px; font-weight: bold; }
        .ok { background: #E4F3EA; color: #2F7D5A; }
        .warn { background: #FBE9E7; color: #B23A2E; }
    </style>
</head>
<body>
<div class="container">

    <!-- LOGIN -->
    <div id="loginArea" class="card">
        <h1>Admin SIMPeL</h1>
        <input type="password" id="adminPass" placeholder="Password Admin">
        <button onclick="loginAdmin()">Masuk</button>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboardArea" class="hide card">
        <h2>Daftar Transaksi</h2>
        <table>
            <thead>
                <tr>
                    <th>Order ID</th>
                    <th>Paket</th>
                    <th>Jumlah</th>
                    <th>Status</th>
                    <th>Aksi</th>
                </tr>
            </thead>
            <tbody id="tblTransactions"></tbody>
        </table>
        
        <div id="hasilVerifikasi" class="hide" style="margin-top:20px; border-top:1px solid #ddd; padding-top:20px;">
            <h3>Hasil</h3>
            <b id="hasilUserId" style="font-size: 18px;"></b>
            <button onclick="kirimKeWhatsApp()" style="background:#25D366;">Kirim ke WhatsApp</button>
        </div>
    </div>

</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script>
    const firebaseConfig = { /* config Anda */ };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function loginAdmin() {
        if (document.getElementById('adminPass').value === 'admin123') {
            document.getElementById('loginArea').classList.add('hide');
            document.getElementById('dashboardArea').classList.remove('hide');
            listen();
        }
    }

    function listen() {
        // Listener real-time: otomatis update saat data berubah
        db.ref('transactions').on('value', (snap) => {
            const data = snap.val();
            renderTable(data);
        });
    }

    function renderTable(data) {
        const tbody = document.getElementById('tblTransactions');
        tbody.innerHTML = '';
        if (!data) return;
        
        Object.entries(data).forEach(([key, val]) => {
            const status = val.status === 'PAID' ? '<span class="tag ok">PAID</span>' : '<span class="tag warn">PENDING</span>';
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><b>${val.order_id}</b></td>
                <td>${val.paket}</td>
                <td>Rp ${val.amount.toLocaleString()}</td>
                <td>${status}</td>
                <td>
                    ${val.status === 'PAID' ? 
                        `<button onclick="buatUserID('${val.order_id}', '${val.paket}', '${key}')">Buat User ID</button>` : 
                        '-'}
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    async function buatUserID(orderId, paket, key) {
        const userId = 'DRN-' + Math.random().toString(36).substring(2, 8).toUpperCase();
        
        // Simpan User ID ke database
        await db.ref('users/' + userId).set({
            id: userId,
            paket: paket,
            order_id: orderId,
            status: 'Aktif'
        });
        
        // Tandai sebagai sudah diproses
        await db.ref('transactions/' + key + '/verified').set(true);
        
        document.getElementById('hasilVerifikasi').classList.remove('hide');
        document.getElementById('hasilUserId').textContent = userId;
        
        // Reset untuk kirim WhatsApp
        sessionStorage.setItem('currentUserId', userId);
        sessionStorage.setItem('currentOrderId', orderId);
    }

    function kirimKeWhatsApp() {
        const userId = sessionStorage.getItem('currentUserId');
        const nomor = '6281234567890';
        const pesan = `Halo Admin, User ID saya: ${userId}. Mohon diaktifkan`;
        window.open(`https://wa.me/${nomor}?text=${encodeURIComponent(pesan)}`);
    }
</script>
</body>
</html>
